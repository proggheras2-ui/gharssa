CAIIBpQACAIQBuQACAMUBaAACAMgBcQACANoBaQACANwBagACAOAABAAKABAAFgAcAZ8AAgCCAacAAgCEAboAAgDFAWsAAgDIAAcAEAAWABwAIgAoAC4ANAGgAAIAggGoAAIAhAG7AAIAxQFsAAIAyAFyAAIA2gF3AAIA3AF8AAIA4AABABoAXQBhAGMAZwBrAG8AcAB3AHgAewB8AIcAiACLAIwAjwCQAJMAlACoAKwAuADCAMkA3QDhAAAAAAABAAAAAA==) format("opentype");font-weight:500;font-display:swap}
:root{
  --navy:#283370; --sky:#0AA4AD; --red:#DE4A52; --yellow:#FDB515; --white:#FFFFFF;
  --ink:#283370; --paper:#FFFFFF; --mist:#EEF3F8; --line:#D9E2EE; --soft:#4a5488;
  --grad:linear-gradient(135deg,#283370 0%,#0AA4AD 100%);
  --f:"Ruqiaround","Segoe UI","Tahoma",sans-serif;
  --r:24px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-weight:500;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--yellow);outline-offset:3px;border-radius:14px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header band: logos only */
.brand{background:var(--white)}
.brand .wrap{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,48px);padding-block:18px}
.brand img{height:clamp(46px,8vw,66px);width:auto;display:block}
.brand .sep{width:3px;height:clamp(40px,7vw,58px);background:var(--navy);border-radius:2px}

/* hero */
.hero{background:var(--grad);color:var(--white);position:relative;overflow:hidden}
.hero .wrap{position:relative;padding-block:clamp(26px,5vw,50px) clamp(70px,11vw,110px);text-align:center}
.hero h1{font-weight:700;font-size:clamp(46px,10vw,92px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.hero h1 span{color:var(--yellow)}
.hero p{font-size:clamp(18px,3.6vw,26px);margin:0 auto;max-width:44ch;text-wrap:balance}
.tally{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:var(--white);color:var(--navy);border-radius:999px;padding:10px 22px 10px 16px;font-weight:700;font-size:20px}
.tally b{font-size:24px} .tally svg{width:28px;height:28px}
.badges{display:flex;justify-content:center;gap:clamp(8px,2vw,16px);margin-top:18px;flex-wrap:wrap}
.badge{width:clamp(54px,11vw,70px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;position:relative;border:3px dashed rgba(255,255,255,.35)}
.badge img{width:56%;filter:grayscale(1) brightness(2.2);opacity:.45}
.badge.on{background:var(--white);border:3px solid var(--yellow);animation:pop .5s}
.badge.on img{filter:none;opacity:1}
.badge small{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--white);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.badge.on small{background:var(--yellow);color:var(--navy)}
.doodle{position:absolute;width:var(--s,56px);height:auto;pointer-events:none;animation:float 7s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (max-width:640px){.doodle.hide-s{display:none}.doodle{--s:40px!important}}
@keyframes float{50%{transform:translateY(-12px) rotate(var(--rot,6deg))}}

/* filters + shelf */
.shelf{margin-top:clamp(-70px,-9vw,-48px);position:relative;z-index:2;padding-bottom:40px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--white);color:var(--navy);border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;box-shadow:0 8px 20px -12px rgba(40,51,112,.6)}
.chip[aria-pressed="true"]{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vw,24px)}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;text-align:right;background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:0 14px 34px -18px rgba(40,51,112,.55),0 2px 0 rgba(40,51,112,.06);transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s}
.card:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 24px 40px -18px rgba(40,51,112,.6)}
.card:active{transform:scale(.98)}
.card.new .art::after{content:"جديدة";position:absolute;top:12px;left:12px;background:var(--white);color:var(--red);font-weight:700;font-size:14px;border-radius:99px;padding:2px 12px;z-index:2}
.art{height:150px;position:relative;display:grid;place-items:center;overflow:hidden}
.art .big{font-weight:700;font-size:92px;color:var(--white);line-height:1;position:relative;z-index:1;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.art svg.big{width:110px;height:110px}
.art img.ic{position:absolute;width:52px}
.c-sky .art{background:var(--sky)} .c-yel .art{background:var(--yellow)} .c-red .art{background:var(--red)}
.c-navy .art{background:var(--navy)} .c-grad .art{background:var(--grad)} .c-grad2 .art{background:linear-gradient(135deg,#0AA4AD,#283370)}
.c-yel .art .big{color:var(--navy);text-shadow:none}
.meta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:14px;font-weight:700;color:var(--sky);background:#E6F6F7;border-radius:999px;padding:3px 12px}
.meta h3{margin:2px 0 0;font-size:26px;font-weight:700;color:var(--navy)}
.meta p{margin:0;font-size:17px;line-height:1.55;color:var(--soft)}
.stars{display:flex;gap:4px;margin-top:auto;padding-top:8px}
.stars svg{width:24px;height:24px}

/* footer band: identity doodles only */
.foot{background:var(--white);border-top:1px solid var(--line)}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:22px;flex-wrap:wrap}
.foot img{height:34px;width:auto}

/* ===== stage ===== */
.stage{position:fixed;inset:0;z-index:50;background:var(--grad);display:flex;flex-direction:column;color:var(--white);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage[hidden]{display:none}
.bar{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px))}
.iconbtn{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.iconbtn svg{width:26px;height:26px}
.iconbtn.say{background:var(--yellow)}
.bar h2{margin:0;font-size:24px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.prog i{display:block;height:100%;width:0;background:var(--yellow);border-radius:99px;transition:width .4s}
.play{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,24px);padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.ask{font-size:clamp(24px,5vw,34px);font-weight:700;margin:0;text-wrap:balance}
.ask small{display:block;font-weight:500;font-size:.62em;opacity:.95;margin-top:4px}
.pic{width:min(62vw,240px);aspect-ratio:1;max-width:100%;background:var(--white);border-radius:28px;display:grid;place-items:center;padding:14px;box-shadow:0 18px 30px -16px rgba(0,0,0,.45)}
.pic img{width:100%;height:100%;object-fit:contain}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,560px)}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,440px)}
@media (max-width:460px){.opts:not(.three){grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{background:var(--white);color:var(--navy);border-radius:22px;font-size:clamp(42px,10vw,58px);font-weight:700;line-height:1;padding:16px 0 20px;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .15s;min-height:84px;display:grid;place-items:center}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opt.ok{background:var(--yellow);animation:pop .45s}
.opt.no{background:var(--red);color:var(--white);animation:shake .4s}
.opt svg{width:70%;height:auto;max-height:64px}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.big-say{display:inline-flex;align-items:center;gap:10px;background:var(--white);color:var(--navy);border-radius:999px;padding:14px 26px;font-size:22px;font-weight:700;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.big-say svg{width:34px;height:34px}
.big-say.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* learn */
.lcard{background:var(--white);color:var(--navy);border-radius:30px;width:min(100%,520px);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;box-shadow:0 20px 34px -18px rgba(0,0,0,.5)}
.lcard .L{font-size:clamp(100px,24vw,160px);font-weight:700;line-height:1;color:var(--white);background:var(--navy);border-radius:24px;aspect-ratio:1;display:grid;place-items:center;padding-bottom:.12em}
.lcard .im{aspect-ratio:1;display:grid;place-items:center}
.lcard .im img{width:100%;height:100%;object-fit:contain}
.lcard .im .ph{font-size:20px;color:var(--soft)}
.lcard .word{grid-column:1/-1;font-size:34px;font-weight:700}
.lcard .word em{font-style:normal;color:var(--red)}
.lcard .rhyme{grid-column:1/-1;font-size:20px;line-height:1.7;background:var(--mist);border-radius:18px;padding:10px 14px;margin:0;text-align:center}
.lcard button{display:block;width:100%}
.lnav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:var(--white);color:var(--navy);border-radius:999px;padding:12px 22px;font-size:20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pill.y{background:var(--yellow)}
.pill svg{width:22px;height:22px}
.count{font-size:18px;opacity:.95;min-width:64px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,560px)}
@media (max-width:460px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{aspect-ratio:3/4;perspective:800px}
.tile .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .in,.tile.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.back{background:var(--white);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.back img{width:46%}
.front{background:var(--white);transform:rotateY(180deg);color:var(--navy);font-size:clamp(44px,11vw,64px);font-weight:700}
.front img{width:86%;height:86%;object-fit:contain}
.tile.done .front{background:#FFF5D9;box-shadow:inset 0 0 0 4px var(--yellow)}

/* train */
.track{width:min(100%,640px);display:flex;align-items:flex-end;gap:6px;min-height:120px;padding-bottom:14px;border-bottom:6px dashed rgba(255,255,255,.55);overflow-x:auto}
.engine{flex:none;width:92px;height:86px}
.wagon{flex:none;width:70px;height:72px;border-radius:14px 14px 8px 8px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:42px;font-weight:700;position:relative;animation:roll .5s ease-out}
.wagon:nth-child(odd){background:var(--white)}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:-12px;width:20px;height:20px;border-radius:50%;background:var(--navy);border:4px solid var(--white)}
.wagon::before{right:8px}.wagon::after{left:8px}
.slot{flex:none;width:70px;height:72px;border-radius:14px;border:3px dashed rgba(255,255,255,.6)}
.track.go .engine,.track.go .wagon{animation:chug .9s ease-in forwards}
@keyframes chug{to{transform:translateX(-120vw)}}
@media (max-width:560px){.track{gap:4px}.engine{width:62px;height:58px}.wagon,.slot{width:42px;height:48px;font-size:28px;border-radius:10px}.wagon::before,.wagon::after{width:14px;height:14px;bottom:-9px;border-width:3px}.wagon::before{right:4px}.wagon::after{left:4px}.letters .opt{width:72px}}
@keyframes roll{from{transform:translateX(-60px);opacity:0}}
.letters{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(100%,560px)}
.letters .opt{width:84px}
.letters .opt.used{visibility:hidden}

/* bubbles (harakat) */
.bubbles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(100%,420px)}
.bub{aspect-ratio:1;border-radius:50%;background:var(--white);color:var(--navy);font-size:clamp(46px,12vw,64px);font-weight:700;box-shadow:0 7px 0 rgba(0,0,0,.18);display:grid;place-items:center;line-height:1;padding-bottom:.1em;transition:transform .15s}
.bub.ok{background:var(--yellow);animation:pop .45s}
.bub.no{background:var(--red);color:var(--white);animation:shake .4s}
.bub.gone{transform:scale(.85);opacity:.55;pointer-events:none}
.mark{display:inline-grid;place-items:center;min-width:1.9em;height:1.7em;padding:0 .2em .2em;border-radius:14px;background:var(--white);color:var(--red);font-size:1.6em;font-weight:700;vertical-align:middle;margin-inline:6px;line-height:1}

/* baskets */
.item{background:var(--white);color:var(--navy);border-radius:28px;font-size:clamp(70px,18vw,104px);font-weight:700;padding:10px 40px 26px;line-height:1.25;box-shadow:0 14px 0 rgba(0,0,0,.16);animation:drop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes drop{from{transform:translateY(-40px) scale(.8);opacity:0}}
.baskets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,640px)}
@media (max-width:520px){.baskets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bk{border-radius:22px;padding:14px 8px 16px;font-size:22px;font-weight:700;color:var(--white);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.bk .sym{font-size:44px;line-height:1;height:52px;display:grid;place-items:center}
.bk.t{background:var(--red)} .bk.s{background:var(--sky)} .bk.sh{background:var(--yellow);color:var(--navy)} .bk.m{background:var(--navy);box-shadow:0 7px 0 rgba(0,0,0,.2),inset 0 0 0 3px rgba(255,255,255,.5)}
.bk.ok{animation:pop .45s;outline:5px solid var(--white)} .bk.no{animation:shake .4s}

/* balloons */
.field{position:relative;width:min(100%,640px);height:min(58vh,480px);border-radius:28px;background:rgba(255,255,255,.1);overflow:hidden;touch-action:manipulation;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.ball{position:absolute;bottom:0;width:86px;height:118px;will-change:transform;padding:0}
.ball svg{width:100%;height:100%;display:block;overflow:visible}
.ball span{position:absolute;top:10px;left:0;right:0;font-size:44px;font-weight:700;line-height:1.3;color:var(--navy);pointer-events:none}
.ball.w span{color:var(--white)}
.ball.pop{animation:popb .3s forwards;pointer-events:none}
@keyframes popb{to{transform:var(--t) scale(1.6);opacity:0}}
.ball.bad{animation:shake .35s}
.target{display:inline-flex;align-items:center;gap:12px}
.target b{background:var(--white);color:var(--navy);border-radius:18px;font-size:46px;line-height:1.25;padding:0 18px 6px;min-width:70px}
.hits{display:flex;gap:6px}
.hits i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3)}
.hits i.on{background:var(--yellow)}
@media (max-width:520px){.ball{width:68px;height:94px}.ball span{font-size:34px;top:8px}}

/* odd one / dots */
.oddgrid{display:grid;gap:10px;width:min(100%,520px)}
.oddgrid .opt{font-size:clamp(34px,8vw,52px);min-height:70px;padding:10px 0 16px}
.dotsbtn svg circle{fill:var(--navy)}
.bigL{background:var(--white);color:var(--navy);border-radius:32px;font-size:clamp(120px,30vw,190px);font-weight:700;line-height:1.2;padding:0 44px 18px;box-shadow:0 14px 0 rgba(0,0,0,.16);animation:drop .45s cubic-bezier(.2,.9,.3,1.3)}

/* pattern */
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.12);border-radius:26px;padding:16px;width:min(100%,680px)}
.seq .cell{width:clamp(48px,11vw,70px);aspect-ratio:1;background:var(--white);border-radius:18px;display:grid;place-items:center}
.seq .cell svg{width:78%;height:78%}
.seq .cell.q{background:transparent;border:4px dashed var(--yellow);color:var(--yellow);font-size:38px;font-weight:700}
.seq .cell.fill{animation:pop .45s}

/* coloring */
.cwrap{position:relative;width:min(88vw,52vh,430px);aspect-ratio:1;background:var(--white);border-radius:28px;box-shadow:0 18px 30px -16px rgba(0,0,0,.45);overflow:hidden;touch-action:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cwrap canvas.top{pointer-events:none}
.tools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sw{width:54px;height:54px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.2);border:4px solid var(--white);display:grid;place-items:center}
.sw[aria-pressed="true"]{outline:5px solid var(--yellow);outline-offset:2px;transform:scale(1.08)}
.sw.er{background:var(--white)}
.sw svg{width:30px;height:30px}
.sz{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--white)}
.sz[aria-pressed="true"]{background:var(--yellow)}
.sz[aria-pressed="true"] i{background:var(--navy)}
.want{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.12em;border:3px solid var(--white);margin-inline:6px}
.meter{width:min(100%,320px);height:16px;border-radius:99px;background:var(--mist);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .8s}

/* feedback + end */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--white);color:var(--navy);font-weight:700;font-size:22px;padding:12px 26px;border-radius:999px;opacity:0;transition:.3s;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.end{background:var(--white);color:var(--navy);border-radius:32px;padding:28px 24px;width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 24px 40px -18px rgba(0,0,0,.5)}
.end h3{margin:0;font-size:38px;font-weight:700}
.end p{margin:0;font-size:20px;color:var(--soft)}
.end .stars svg{width:54px;height:54px;animation:pop .5s backwards}
.end .stars svg:nth-child(2){animation-delay:.15s}.end .stars svg:nth-child(3){animation-delay:.3s}
.end .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end .pill{box-shadow:none;background:var(--mist)}
.end .pill.y{background:var(--yellow)}
.end .unlock{display:flex;align-items:center;gap:10px;background:#FFF5D9;border-radius:18px;padding:8px 14px;font-weight:700}
.end .unlock img{width:40px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
