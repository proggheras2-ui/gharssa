<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | برنامج غرس</title>
<link rel="icon" href="../assets/img/icon.png">
<style>
@font-face{font-family:"Ruqiaround";src:url(../assets/fonts/Ruqiaround-Bold.otf) format("opentype");font-weight:700}
@font-face{font-family:"Ruqiaround";src:url(../assets/fonts/Ruqiaround-Medium.otf) format("opentype");font-weight:500}
:root{--navy:#283370;--sky:#0AA4AD;--red:#DE4A52;--yellow:#FDB515;--white:#fff;--mist:#EEF3F8;--line:#D9E2EE;--soft:#4a5488;--grad:linear-gradient(135deg,#283370,#0AA4AD);--f:"Ruqiaround",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--navy);font:500 16px/1.6 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.brand{background:var(--navy);display:flex;justify-content:center;align-items:center;gap:28px;padding:14px}
.brand img{height:46px}.brand .sep{width:2px;height:40px;background:#fff}
.top{background:var(--grad);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;flex:1}
.top a,.top button{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;text-decoration:none}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;max-width:1200px;margin:18px auto;padding:0 16px 120px}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;align-self:start}
@media(max-width:820px){.tabs{flex-direction:row;overflow-x:auto;position:static}}
.tabs button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:right;font-weight:700;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{min-width:0;background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px -22px rgba(40,51,112,.6)}
.panel h2{margin:0 0 6px;font-size:26px}.panel>p.help{margin:0 0 16px;color:var(--soft)}
h3.sub{margin:22px 0 10px;font-size:20px;display:flex;align-items:center;gap:8px}
h3.sub::before{content:"";width:8px;height:22px;border-radius:4px;background:var(--grad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
label.f.full{grid-column:1/-1}
input[type=text],input[type=url],input[type=number],input[type=password],select,textarea{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-weight:500;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky)}
.item{border:2px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;overflow:hidden}
.item.off{opacity:.55}
.ihead{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--mist)}
.ihead .t{flex:1;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:#fff;font-size:16px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--yellow)}.ib.del:hover{background:var(--red);color:#fff}
.ib:disabled{opacity:.3;cursor:default;background:#fff}
.ibody{padding:12px}.item.closed .ibody{display:none}
.add{border:2px dashed var(--sky);background:#fff;color:var(--sky);border-radius:14px;padding:8px 16px;font-weight:700}
.add:hover{background:var(--sky);color:#fff}
.btn{border:0;border-radius:999px;padding:10px 22px;font-weight:700;background:var(--navy);color:#fff}
.btn.y{background:var(--yellow);color:var(--navy)}.btn.r{background:var(--red)}.btn.g{background:#fff;color:var(--navy);border:2px solid var(--line)}
.savebar{position:fixed;bottom:0;inset-inline:0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;z-index:20;box-shadow:0 -10px 30px -10px rgba(0,0,0,.4);transform:translateY(110%);transition:transform .3s}
.savebar.on{transform:none}.savebar:not(.on){box-shadow:none}.savebar span{flex:1;font-weight:700}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-150%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:999px;font-weight:700;z-index:40;transition:transform .3s}
.toast.on{transform:translateX(-50%)}.toast.err{background:var(--red)}
.login{max-width:560px;margin:40px auto;padding:0 16px}
.steps{background:var(--mist);border-radius:16px;padding:12px 16px 12px 30px;margin:12px 0;font-size:15px}
.steps li{margin-bottom:6px}
.kid{display:inline-flex;align-items:center;gap:6px;background:var(--mist);border-radius:999px;padding:4px 6px 4px 12px;margin:4px;font-weight:700}
.kid button{width:26px;height:26px;border-radius:50%;border:0;background:#fff;color:var(--red);font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--mist)}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.thumb .acts{position:absolute;bottom:4px;inset-inline:4px;display:flex;gap:4px;justify-content:center}
.thumb .acts .ib{width:30px;height:30px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700}
.note{background:#FFF6E0;border-radius:14px;padding:10px 14px;font-size:14px;margin:10px 0}
.tscroll{overflow:auto;max-height:70vh;border:2px solid var(--line);border-radius:14px}
table.lt{border-collapse:separate;border-spacing:0;font-size:15px}
table.lt th,table.lt td{border-bottom:1px solid var(--line);padding:3px;text-align:center;background:#fff}
table.lt thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2;min-width:38px;padding:8px 4px}
table.lt .nm{position:sticky;right:0;z-index:1;text-align:right;white-space:nowrap;padding:6px 10px;min-width:170px;background:var(--mist)}
table.lt thead .nm{z-index:3;background:var(--navy)}
.mk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:18px;line-height:1}
.mk.ok{background:var(--sky);border-color:var(--sky);color:#fff}.mk.no{background:var(--red);border-color:var(--red);color:#fff}
.mk.busy{opacity:.5}.mk:disabled{cursor:default}
td.sc{font-weight:700;color:var(--navy);white-space:nowrap;padding:0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header class="brand"><img src="../assets/img/gheras_w.png" alt="جمعية غراس لتنمية الطفل"><span class="sep"></span><img src="../assets/img/ghars_w.png" alt="برنامج غرس"></header>
<div id="app"></div>
<div class="savebar" id="savebar"><span>لديك تعديلات غير منشورة</span><button class="btn g" id="discard">تجاهل</button><button class="btn y" id="save">حفظ ونشر على الموقع</button></div>
<div class="toast" id="toast"></div>
<script>

const LIVE='https://script.google.com/macros/s/AKfycbyL3oIz9BJNkck2ctg85zEYBstz_dN_XJ8tgrmj4iORVQeVQWPtFhgyJYW9svZu9RHzPw/exec';
const qp=new URLSearchParams(location.search);const API_URL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&qp.get('api')?qp.get('api'):LIVE;
const RAW=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'../':'https://raw.githubusercontent.com/proggheras2-ui/gharssa/main/';
const GAMES=[['learn','بطاقات الحروف'],['listen','أين الحرف؟'],['pick','صورة وحرف'],['balloons','بالونات الحروف'],['memory','ذاكرة الحروف'],['train','قطار الحروف'],['odd','الحرف المختلف'],['dots','عُدّ النقاط'],['word3','قطار الكلمات الثلاثية'],['word4','قطار الكلمات الرباعية'],['harakat','صيّاد الحركات'],['hear','اسمع الحركة'],['sort','سلال القراءة'],['readpick','اسمع واقرأ'],['trace','اكتب الحرف'],['color','لوّن الشكل'],['pattern','ما الشكل التالي؟']];
const ICONS=[['book','كتاب'],['letters','حروف أ ب'],['game','لعبة'],['tree','شجرة'],['form','نموذج'],['hand','يد'],['heart','قلب'],['bus','حافلة'],['store','متجر'],['play','تشغيل'],['pdf','ملف'],['mic','ميكروفون'],['phone','هاتف'],['mail','بريد'],['map','موقع']];
const DOODLES=[['i_book_c','كتاب'],['i_star_c','نجمة'],['i_pencil_c','قلم'],['i_puzzle_c','أحجية'],['i_sun_c','شمس'],['i_leaf_c','ورقة'],['i_spiral_c','دوامة'],['i_tri_c','مثلث']];
const TILE_C=[['t-navy','كحلي'],['t-navy2','تدرّج سماوي→كحلي'],['t-grad','تدرّج الهوية'],['t-sky','سماوي'],['t-red','أحمر'],['t-yel','أصفر']];
const LV_C=[['yel','أصفر'],['sky','سماوي'],['red','أحمر'],['navy','كحلي']];
const ST_C=[['n','كحلي'],['s','سماوي'],['y','أصفر'],['r','أحمر']];
const SEC_T={tiles:'بطاقات الأقسام',stats:'شريط الأرقام',comps:'مكوّنات البرنامج',levels:'رحلة المستويات',cards:'بطاقات الأنشطة',videos:'مرئيات',stores:'المتاجر',text:'نص حر'};
const PAGE_T={gallery:'معرض صور',video:'فيديو يوتيوب',join:'بطاقات انضمام',text:'نص'};
const $=s=>document.querySelector(s);const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PERM_L={letters:'إدخال إتقان الحروف لطلابه',kidsview:'عرض نتائج إتقان الحروف فقط',students:'إدارة أسماء الطلاب وأرقام أولياء الأمور',content:'تعديل محتوى الموقع وصفحاته',media:'رفع الصور في معارض الصور',games:'ترتيب الألعاب وإخفاؤها'};
const ERR={auth:'انتهت الجلسة، سجّل الدخول من جديد',forbidden:'ليست لديك صلاحية لهذا الإجراء',bad:'الإيميل أو الرقم السري غير صحيح',locked:'محاولات كثيرة.. انتظر ١٥ دقيقة',weak:'الرقم السري قصير (٨ أحرف على الأقل)',email:'الإيميل غير صحيح',dup:'هذا الإيميل مسجّل مسبقًا',self:'لا يمكنك حذف حسابك أو إلغاء صلاحية المدير عن نفسك',token:'مفتاح GitHub غير صحيح',tokenperm:'المفتاح لا يملك صلاحية الكتابة على الموقع',notoken:'لم يُضبط مفتاح GitHub بعد',exists:'تم إعداد المدير مسبقًا',conflict:'عدّل شخص آخر المحتوى الآن.. حدّث الصفحة',moved:'تغيّر ترتيب الطلاب في الجدول.. حدّث الصفحة',empty:'لم أجد طلابًا في الملف',badpin:'الرمز غير صحيح',pinweak:'رمز المعلم يجب أن يكون ٦ أرقام على الأقل',pindup:'هذا الرمز مستخدم لمعلم آخر، اختر رمزًا مختلفًا',size:'الصورة كبيرة جدًا'};
let TOK='',ME=null,SHEETS=[];try{TOK=sessionStorage.getItem('ghars_tok')||localStorage.getItem('ghars_tok')||''}catch(e){}
let C=null,SHA=null,ORIG='',tab=null;
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3000)}
async function api(a,data={}){let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify({a,tok:TOK,...data})}).then(x=>x.json())}catch(e){throw Object.assign(new Error('net'),{msg:'تعذّر الاتصال بالخادم، تحقّق من الإنترنت'})}
 if(!r.ok){const e=new Error(r.error);e.code=r.error;e.msg=ERR[r.error]||('خطأ: '+r.error);if(r.error==='auth'&&ME){ME=null;loginView(e.msg)}throw e}return r}
const can=p=>ME&&(ME.role==='admin'||ME.perms.includes(p));
function dirty(){$('#savebar').classList.toggle('on',!!C&&JSON.stringify(C)!==ORIG)}
const keepTok=(t,remember)=>{TOK=t;try{sessionStorage.setItem('ghars_tok',t);if(remember)localStorage.setItem('ghars_tok',t);else localStorage.removeItem('ghars_tok')}catch(e){}};

/* ---------- login & first-time setup ---------- */
async function boot(){if(TOK){try{const r=await api('me');ME=r.user;SHEETS=r.sheets;return main()}catch(e){TOK=''}}
 $('#app').innerHTML='<div class="login"><div class="panel"><p class="help">جارٍ التحميل...</p></div></div>';
 try{const s=await api('status');s.setup?setupView():loginView()}catch(e){$('#app').innerHTML=`<div class="login"><div class="panel"><h2>لوحة التحكم</h2><p class="help">${esc(e.msg)}</p><div class="note">إذا كانت هذه أول مرة، تأكّد أن كود لوحة التحكم (Api.gs) مضاف إلى سكربت «إتقان الحروف» وأن النشر مُحدَّث.</div></div></div>`}}
function loginView(msg){$('#savebar').classList.remove('on');$('#app').innerHTML=`<div class="login"><div class="panel"><h2>تسجيل الدخول</h2><p class="help">لوحة تحكم موقع غرس — للمدير والمعلمين.</p>
<form id="lf"><label class="f">الإيميل<input type="email" id="le" autocomplete="username" dir="ltr" required></label><br><label class="f">الرقم السري<input type="password" id="lp" autocomplete="current-password" required></label>
<label class="chk" style="margin:12px 0"><input type="checkbox" id="lr"> تذكّرني على هذا الجهاز</label>
<div class="row"><button class="btn y" type="submit">دخول</button><span id="lmsg" style="color:var(--red);font-weight:700">${esc(msg||'')}</span></div></form>
<p class="help" style="margin-top:14px">نسيت الرقم السري؟ اطلب من مدير الموقع تعيين رقم جديد لك.</p></div></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#lmsg').textContent='جارٍ الدخول...';try{const r=await api('login',{email:$('#le').value,password:$('#lp').value});keepTok(r.tok,$('#lr').checked);ME=r.user;SHEETS=r.sheets;tab=null;main()}catch(err){$('#lmsg').textContent=err.msg}}}
function setupView(){$('#app').innerHTML=`<div class="login"><div class="panel"><h2>إعداد حساب المدير (مرة واحدة)</h2><p class="help">أنشئ حسابك كمدير للموقع. بعدها تدخل بالإيميل والرقم السري من أي جهاز، وتضيف المعلمين وتحدد صلاحياتهم.</p>
<div class="grid2"><label class="f">اسمك<input id="sn" value="مدير الموقع"></label><label class="f">الإيميل<input type="email" id="se" dir="ltr"></label><label class="f">الرقم السري (٨ أحرف على الأقل)<input type="password" id="sp" autocomplete="new-password"></label><label class="f">أعد كتابة الرقم السري<input type="password" id="sp2" autocomplete="new-password"></label></div>
<h3 class="sub">مفتاح GitHub (يُحفظ في الخادم فقط)</h3><ol class="steps"><li>افتح <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">صفحة إنشاء مفتاح في GitHub</a> وأنت مسجّل الدخول.</li>
<li>اكتب اسمًا مثل «لوحة غرس»، وفي <b>Expiration</b> اختر مدة طويلة (سنة أو No expiration).</li><li>في <b>Repository access</b> اختر <b>Only select repositories</b> ثم <b>gharssa</b>.</li>
<li>في <b>Permissions</b> → <b>Contents</b> اختر <b>Read and write</b>.</li><li>اضغط <b>Generate token</b> وانسخ المفتاح والصقه هنا.</li></ol>
<label class="f">مفتاح GitHub<input type="password" id="st" placeholder="github_pat_..." dir="ltr"></label>
<div class="row" style="margin-top:12px"><button class="btn y" id="sgo">إنشاء الحساب</button><span id="smsg" style="color:var(--red);font-weight:700"></span></div></div></div>`;
 $('#sgo').onclick=async()=>{const m=$('#smsg');if($('#sp').value!==$('#sp2').value){m.textContent='الرقمان السريّان غير متطابقين';return}m.textContent='جارٍ الإعداد...';
  try{const r=await api('setup',{name:$('#sn').value,email:$('#se').value,password:$('#sp').value,ghToken:$('#st').value.trim()});keepTok(r.tok,true);ME=r.user;SHEETS=r.sheets;tab='students';main();toast('تم إنشاء حسابك ✓ الخطوة التالية: استورد ملف الطلاب')}catch(e){m.textContent=e.msg}}}

/* ---------- generic editors ---------- */
function field(obj,f){const w=el('label','f'+(f.full||f.type==='textarea'?' full':''),esc(f.label));let i;
 if(f.type==='select'){i=el('select');f.opts.forEach(([v,l])=>{const o=el('option','',esc(l));o.value=v;i.appendChild(o)});i.value=obj[f.k]??f.opts[0][0]}
 else if(f.type==='textarea'){i=el('textarea');i.value=obj[f.k]??''}
 else if(f.type==='check'){const c=el('label','chk');i=el('input');i.type='checkbox';i.checked=obj[f.k]!==false;c.append(i,document.createTextNode(f.label));i.onchange=()=>{obj[f.k]=i.checked;dirty()};return c}
 else{i=el('input');i.type=f.type==='num'?'number':f.type==='url'?'url':'text';i.value=obj[f.k]??'';if(f.ph)i.placeholder=f.ph;if(f.type==='url')i.dir='ltr'}
 i.oninput=i.onchange=()=>{obj[f.k]=f.type==='num'?+i.value:i.value;dirty();if(f.onchange)f.onchange()};w.appendChild(i);return w}
function fields(obj,list){const g=el('div','grid2');list.forEach(f=>g.appendChild(f.type==='list'?listBlock(obj,f):field(obj,f)));return g}
function listBlock(obj,f){const w=el('div','f full');w.style.gridColumn='1/-1';w.appendChild(el('h3','sub',esc(f.label)));obj[f.k]=obj[f.k]||[];w.appendChild(listEd(obj[f.k],f));return w}
function listEd(arr,o){const box=el('div');
 const draw=()=>{box.innerHTML='';arr.forEach((it,i)=>{const card=el('div','item closed'+(it.show===false?' off':''));const h=el('div','ihead');
   const t=el('span','t',esc((o.title?o.title(it):it[o.fields[0].k])||'(بدون عنوان)'));t.onclick=()=>card.classList.toggle('closed');
   const up=el('button','ib','▲');up.title='أعلى';up.disabled=i===0;up.onclick=()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];dirty();draw()};
   const dn=el('button','ib','▼');dn.title='أسفل';dn.disabled=i===arr.length-1;dn.onclick=()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];dirty();draw()};
   h.append(t,up,dn);
   if(o.toggle){const v=el('button','ib',it.show===false?'🚫':'👁');v.title=it.show===false?'إظهار':'إخفاء';v.onclick=()=>{it.show=it.show===false;dirty();draw()};h.appendChild(v)}
   const ed=el('button','ib','✎');ed.title='تعديل';ed.onclick=()=>card.classList.toggle('closed');h.appendChild(ed);
   if(o.del!==false){const d=el('button','ib del','🗑');d.title='حذف';d.onclick=()=>{if(confirm('حذف «'+(t.textContent)+'»؟')){arr.splice(i,1);dirty();draw()}};h.appendChild(d)}
   card.appendChild(h);const body=el('div','ibody');const fl=(typeof o.fields==='function'?o.fields(it):o.fields).map(f=>({...f,onchange:()=>{t.textContent=(o.title?o.title(it):it[o.fields[0]?.k])||'(بدون عنوان)';f.onchange&&f.onchange()}}));
   body.appendChild(fields(it,fl));if(o.extra)o.extra(it,body);card.appendChild(body);box.appendChild(card)});
  if(o.blank){const a=el('button','add','+ إضافة '+(o.noun||''));a.onclick=()=>{const n=o.blank();arr.push(n);dirty();draw();box.querySelectorAll('.item')[arr.length-1]?.classList.remove('closed')};box.appendChild(a)}};
 draw();return box}

function resize(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.84).split(',')[1])};img.onerror=rej;img.src=URL.createObjectURL(file)})}

/* ---------- tabs ---------- */

function galleryEd(p,body){p.images=p.images||[];const w=el('div');body.appendChild(el('h3','sub','الصور'));body.appendChild(w);
 const draw=()=>{w.innerHTML='';const g=el('div','thumbs');p.images.forEach((im,i)=>{const t=el('div','thumb');const src=/^https?:/.test(im.thumb||im.full)?(im.thumb||im.full):RAW+(im.thumb||im.full);t.innerHTML=`<img src="${esc(src)}" alt="">`;const a=el('div','acts');
   const r=el('button','ib','▶');r.title='قبل';r.disabled=i===0;r.onclick=()=>{[p.images[i-1],p.images[i]]=[p.images[i],p.images[i-1]];dirty();draw()};
   const l=el('button','ib','◀');l.title='بعد';l.disabled=i===p.images.length-1;l.onclick=()=>{[p.images[i+1],p.images[i]]=[p.images[i],p.images[i+1]];dirty();draw()};
   const d=el('button','ib del','🗑');d.onclick=()=>{if(confirm('حذف الصورة من الصفحة؟')){p.images.splice(i,1);dirty();draw()}};a.append(r,l,d);t.appendChild(a);g.appendChild(t)});w.appendChild(g);
  const up=el('label','add');up.style.display='inline-block';up.style.marginTop='10px';up.textContent='+ رفع صور';const inp=el('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.hidden=true;up.appendChild(inp);w.appendChild(up);
  inp.onchange=async()=>{const fs=[...inp.files];if(!fs.length)return;toast('جارٍ رفع '+fs.length+' صورة...');try{for(const f of fs){const r=await api('media.upload',{full:await resize(f,1400),thumb:await resize(f,520)});p.images.push({full:r.full,thumb:r.thumb,alt:p.title});dirty();draw()}toast('تم رفع الصور ✓ اضغط «حفظ ونشر»')}catch(e){toast('تعذّر رفع الصورة',1)}}};draw()}
const ytId=v=>{v=String(v||'');const m=v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:v.trim()};
function clean(){C.home.forEach(s=>{if(s.type==='videos')s.items.forEach(v=>v.yt=ytId(v.yt))});C.pages.forEach(p=>{if(p.type==='video')p.yt=ytId(p.yt)});C.v=(C.v||1)+1}

$('#save').onclick=async()=>{const b=$('#save');b.disabled=true;b.textContent='جارٍ النشر...';try{clean();const r=await api('content.save',{content:C,sha:SHA});SHA=r.sha;C=r.content;ORIG=JSON.stringify(C);dirty();toast('تم النشر ✓ يظهر على الموقع خلال دقيقة تقريبًا')}
 catch(e){toast(e.msg,1)}b.disabled=false;b.textContent='حفظ ونشر على الموقع'};
$('#discard').onclick=()=>{if(confirm('تجاهل كل التعديلات غير المنشورة؟')){C=JSON.parse(ORIG);main()}};
addEventListener('beforeunload',e=>{if(C&&JSON.stringify(C)!==ORIG){e.preventDefault();e.returnValue=''}});
boot();
