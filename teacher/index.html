<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>دخول المعلمين | برنامج غرس</title>
<link rel="icon" href="../assets/img/icon.png">
<style>
@font-face{font-family:"Ruqiaround";src:url(../assets/fonts/Ruqiaround-Bold.otf) format("opentype");font-weight:700}
@font-face{font-family:"Ruqiaround";src:url(../assets/fonts/Ruqiaround-Medium.otf) format("opentype");font-weight:500}
:root{--navy:#283370;--sky:#0AA4AD;--red:#DE4A52;--yellow:#FDB515;--mist:#EEF3F8;--line:#D9E2EE;--soft:#4a5488;--grad:linear-gradient(135deg,#283370,#0AA4AD);--f:"Ruqiaround",Tahoma,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--navy);font:500 16px/1.6 var(--f);min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.brand{background:var(--navy);display:flex;justify-content:center;align-items:center;gap:28px;padding:14px}.brand img{height:46px}.brand .sep{width:2px;height:40px;background:#fff}
.hero{background:var(--grad);color:#fff;padding:20px 16px;text-align:center}.hero h1{margin:0;font-size:28px}.hero p{margin:4px 0 0;opacity:.9}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border-radius:24px;padding:24px 18px;box-shadow:0 10px 30px -22px rgba(40,51,112,.6)}
.login{max-width:460px;margin:20px auto;text-align:center}
.login h2{margin:0 0 6px;font-size:26px}.login p{color:var(--soft);margin:0 0 16px}
.pins{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0 10px}
.pins input{width:48px;height:60px;border-radius:14px;border:3px solid var(--line);text-align:center;font:700 28px var(--f);color:var(--navy)}
.pins input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(10,164,173,.2)}
.err{color:var(--red);font-weight:700;min-height:26px}
.btn{border:0;border-radius:999px;padding:10px 26px;font-weight:700;background:var(--yellow);color:var(--navy);font-size:18px}
.btn.g{background:#fff;border:2px solid var(--line);font-size:15px;padding:6px 16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar h2{margin:0;flex:1;font-size:24px}
select,.search{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
.legend{color:var(--soft);font-size:14px;margin:0 0 10px}
.tscroll{overflow:auto;max-height:72vh;border:2px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:separate;border-spacing:0}
th,td{border-bottom:1px solid var(--line);padding:3px;text-align:center;background:#fff}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2;min-width:42px;padding:8px 4px}
.nm{position:sticky;right:0;z-index:1;text-align:right;white-space:nowrap;padding:6px 10px;min-width:160px;background:var(--mist)}thead .nm{z-index:3;background:var(--navy)}
.mk{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:19px;line-height:1}
.mk.ok{background:var(--sky);border-color:var(--sky);color:#fff}.mk.no{background:var(--red);border-color:var(--red);color:#fff}.mk.busy{opacity:.5}
td.sc{font-weight:700;white-space:nowrap;padding:0 10px}

/* easy evaluation UI */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.layout.detail .slist{display:none}.layout:not(.detail) .eval{display:none}}
.slist{background:#fff;border-radius:22px;padding:14px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.slist .search{width:100%;margin-bottom:10px}
.sbtn{display:block;width:100%;text-align:right;background:var(--mist);border:2px solid transparent;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.sbtn b{display:block;font-size:16px}.sbtn small{color:var(--soft);font-weight:700}
.sbtn.on{border-color:var(--sky);background:#fff}
.pbar{height:8px;border-radius:99px;background:#fff;overflow:hidden;margin:6px 0 2px}.sbtn.on .pbar{background:var(--mist)}.pbar i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .3s}
.eval{background:#fff;border-radius:22px;padding:16px}
.ehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ehead h3{margin:0;font-size:22px;flex:1;min-width:180px}
.back{background:var(--mist);border:0;border-radius:999px;padding:6px 14px;font-weight:700}
@media(min-width:861px){.back{display:none}}
.count{background:var(--mist);border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;position:sticky;top:0;background:#fff;padding:6px 0;z-index:2}
.modes button{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 6px;font-weight:700;font-size:17px}
.modes button[aria-pressed=true].m1{background:var(--sky);border-color:var(--sky);color:#fff}
.modes button[aria-pressed=true].m0{background:var(--red);border-color:var(--red);color:#fff}
.modes button[aria-pressed=true].mx{background:var(--navy);border-color:var(--navy);color:#fff}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
@media(max-width:420px){.letters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lt{position:relative;aspect-ratio:1;border:3px solid var(--line);background:#fff;border-radius:18px;font-weight:700;font-size:30px;line-height:1;display:grid;place-items:center;padding-bottom:6px;transition:transform .12s}
.lt:active{transform:scale(.94)}
.lt i{position:absolute;bottom:5px;left:0;right:0;font-style:normal;font-size:12px}
.lt.ok{background:var(--sky);border-color:var(--sky);color:#fff}.lt.no{background:var(--red);border-color:var(--red);color:#fff}
.lt.busy::after{content:"";position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.enav{display:flex;gap:10px;margin-top:14px}.enav button{flex:1;border:0;border-radius:999px;padding:12px;font-weight:700;font-size:17px;background:var(--mist)}.enav .nx{background:var(--yellow)}
.enav button:disabled{opacity:.4}
.saved{font-size:13px;color:var(--soft);font-weight:700;min-height:20px;margin-top:6px}
.viewsw{background:none;border:0;color:var(--sky);font-weight:700;text-decoration:underline;padding:0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:999px;font-weight:700;z-index:40;transition:transform .3s}.toast.on{transform:translateX(-50%)}.toast.err{background:var(--red)}
</style>
</head>
<body>
<header class="brand"><img src="../assets/img/gheras_w.png" alt="جمعية غراس لتنمية الطفل"><span class="sep"></span><img src="../assets/img/ghars_w.png" alt="برنامج غرس"></header>
<div class="hero"><h1>بوابة المعلمين</h1><p>اختر الطالب، ثم اضغط على الحروف التي أتقنها</p></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="../assets/report.js"></script>
<script>
const LIVE='https://script.google.com/macros/s/AKfycbwtAZTJu0tl13PkE6D7NjqMbjtnZzopZAuQ5gwiIbdR5K9pMJHAbUBomCkAHujd7-vLyA/exec';
const qp=new URLSearchParams(location.search);const API_URL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&qp.get('api')?qp.get('api'):LIVE;
const $=s=>document.querySelector(s);const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ERR={badpin:'الرمز غير صحيح',locked:'محاولات كثيرة.. انتظر ١٥ دقيقة ثم حاول',auth:'انتهت الجلسة، أدخل الرمز من جديد',forbidden:'ليست لديك صلاحية',moved:'تغيّر ترتيب الطلاب.. حدّث الصفحة'};
let TOK='',ME=null,SHEETS=[];try{TOK=sessionStorage.getItem('ghars_ttok')||''}catch(e){}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2800)}
async function api(a,d={}){let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify({a,tok:TOK,...d})}).then(x=>x.json())}catch(e){throw Object.assign(new Error('net'),{msg:'تعذّر الاتصال، تحقّق من الإنترنت'})}
 if(!r.ok){const e=new Error(r.error);e.msg=ERR[r.error]||'حدث خطأ';if(r.error==='auth'){TOK='';login(e.msg)}throw e}return r}
function login(msg){$('#app').innerHTML=`<div class="card login"><h2>أدخل رمزك</h2><p>اكتب رمز الدخول الذي أعطاك إياه مدير البرنامج</p>
<div class="pins">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="الرقم ${i+1}" autocomplete="off">`).join('')}</div><div class="err" role="alert">${esc(msg||'')}</div><button class="btn" id="go">دخول</button></div>`;
 const ins=[...document.querySelectorAll('.pins input')];const norm=v=>v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
 const go=async()=>{const pin=ins.map(i=>i.value).join('');if(pin.length<6){$('.err').textContent='اكتب الرمز كاملًا';return}$('.err').textContent='جارٍ الدخول...';
  try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({a:'pinlogin',pin})}).then(x=>x.json()).catch(()=>({ok:false,error:'net'}));if(!r.ok)throw Object.assign(new Error(r.error),{msg:r.error==='auth'?'الخادم لم يُحدَّث بعد: انشر «إصدار جديد» من Api.gs':r.error==='net'?'تعذّر الاتصال، تحقّق من الإنترنت':(ERR[r.error]||'حدث خطأ')});TOK=r.tok;try{sessionStorage.setItem('ghars_ttok',TOK)}catch(e){}ME=r.user;SHEETS=r.sheets;grid()}catch(e){$('.err').textContent=e.msg;ins.forEach(i=>i.value='');ins[0].focus()}};
 ins.forEach((inp,i)=>{inp.addEventListener('input',()=>{const v=norm(inp.value);if(v.length>1){v.slice(0,6).split('').forEach((c,j)=>{if(ins[i+j])ins[i+j].value=c})}else inp.value=v;const n=ins.findIndex(x=>!x.value);if(n>=0)ins[n].focus();else go()});
  inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus();if(e.key==='Enter')go()})});
 $('#go').onclick=go;ins[0].focus()}

async function maybeSendReport(d,s,r){if(!r||!r.notify||typeof drawGharsReport!=='function')return;try{const [gh,gs]=await Promise.all([loadImg('../assets/img/gheras_h.png'),loadImg('../assets/img/ghars_h.png')]);
 const cv=await drawGharsReport({name:s.name,teacher:d.sheet,letters:d.letters,marks:s.marks,gheras:gh,ghars:gs,font:'Ruqiaround'});
 const x=await api('report.send',{sheet:d.sheet,row:s.row,name:s.name,png:cv.toDataURL('image/png').split(',')[1]});if(x.sent)toast('📧 اكتمل التقييم وأُرسل التقرير لوليّ الأمر')}catch(e){}}
async function grid(){if(!SHEETS.length){$('#app').innerHTML='<div class="card login"><h2>لا يوجد فصل مرتبط بحسابك</h2><p>اطلب من مدير البرنامج ربط فصلك بحسابك.</p></div>';return}
 $('#app').innerHTML=`<div class="bar"><h2>أهلًا ${esc(ME.name)}</h2>${SHEETS.length>1?'<select id="sh"></select>':''}<button class="btn g" id="out">خروج</button></div><div id="g">جارٍ التحميل...</div>`;
 $('#out').onclick=async()=>{try{await api('logout')}catch(e){}TOK='';try{sessionStorage.removeItem('ghars_ttok')}catch(e){}login()};
 const sel=$('#sh');if(sel){SHEETS.forEach(n=>{const o=el('option','',esc(n));o.value=n;sel.appendChild(o)});sel.onchange=()=>load(sel.value)}
 let mode=1;try{mode=+(localStorage.getItem('ghars_mode')??1)}catch(e){}
 const load=async name=>{const g=$('#g');g.textContent='جارٍ التحميل...';let d;try{d=await api('letters.get',{sheet:name})}catch(e){g.textContent=e.msg;return}
  const N=d.letters.length,done=s=>s.marks.filter(m=>m===1).length;let cur=-1;
  g.innerHTML=`<div class="layout"><aside class="slist"><input class="search" placeholder="ابحث عن طالب" aria-label="ابحث عن طالب"><div class="sl"></div></aside><section class="eval"></section></div>`;
  const L=g.querySelector('.layout'),SL=g.querySelector('.sl'),EV=g.querySelector('.eval');
  const drawList=()=>{const q=g.querySelector('.search').value.trim();SL.innerHTML='';d.students.forEach((s,i)=>{if(q&&!s.name.includes(q))return;const b=el('button','sbtn'+(i===cur?' on':''));const k=done(s);
   b.innerHTML=`<b>${esc(s.name)}</b><div class="pbar"><i style="width:${Math.round(k/N*100)}%"></i></div><small>أتقن ${k} من ${N}</small>`;b.onclick=()=>open(i);SL.appendChild(b)});
   if(!SL.children.length)SL.innerHTML='<p style="color:var(--soft)">لا يوجد طالب بهذا الاسم</p>'};
  g.querySelector('.search').oninput=drawList;
  const open=i=>{cur=i;const s=d.students[i];L.classList.add('detail');drawList();
   EV.innerHTML=`<div class="ehead"><button class="back">→ الطلاب</button><h3>${esc(s.name)}</h3><span class="count"></span></div>
   <div class="modes" role="group" aria-label="نوع التقييم"><button class="m1" data-m="1">✓ أتقن</button><button class="m0" data-m="0">✗ لم يتقن</button><button class="mx" data-m="-1">مسح</button></div>
   <div class="letters"></div><div class="saved" aria-live="polite"></div>
   <div class="enav"><button class="pv">→ السابق</button><button class="nx">التالي ←</button></div>`;
   const cnt=EV.querySelector('.count'),saved=EV.querySelector('.saved');const upd=()=>{cnt.textContent='أتقن '+done(s)+' / '+N;drawList()};
   const paintModes=()=>EV.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===mode));paintModes();
   EV.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;try{localStorage.setItem('ghars_mode',mode)}catch(e){}paintModes()});
   const LG=EV.querySelector('.letters');let pending=0;
   d.letters.forEach((Lt,j)=>{const t=el('button','lt');const paint=()=>{const m=s.marks[j];t.className='lt'+(m===1?' ok':m===0?' no':'');t.innerHTML=`${esc(Lt)}<i>${m===1?'أتقن':m===0?'لم يتقن':''}</i>`;t.setAttribute('aria-label',Lt+': '+(m===1?'أتقن':m===0?'لم يتقن':'لم يُقيَّم'))};paint();
    t.onclick=async()=>{const want=mode===-1?null:mode;const prev=s.marks[j];const nv=prev===want?null:want;s.marks[j]=nv;paint();upd();t.classList.add('busy');pending++;saved.textContent='جارٍ الحفظ...';
     try{const rs=await api('letters.set',{sheet:d.sheet,row:s.row,col:j,name:s.name,value:nv});maybeSendReport(d,s,rs)}catch(e){s.marks[j]=prev;paint();upd();toast(e.msg,1)}
     t.classList.remove('busy');if(--pending===0)saved.textContent='✓ تم حفظ كل التغييرات'};LG.appendChild(t)});
   upd();EV.querySelector('.back').onclick=()=>{L.classList.remove('detail');cur=-1;drawList();scrollTo(0,0)};
   const pv=EV.querySelector('.pv'),nx=EV.querySelector('.nx');pv.disabled=i===0;nx.disabled=i===d.students.length-1;pv.onclick=()=>open(i-1);nx.onclick=()=>open(i+1);
   if(innerWidth<=860)scrollTo(0,0)};
  drawList();if(innerWidth>860&&d.students.length)open(0);else EV.innerHTML='<p style="color:var(--soft)">اختر طالبًا من القائمة لتقييمه</p>'};
 load(SHEETS[0])}
(async()=>{if(TOK){try{const r=await api('me');ME=r.user;SHEETS=r.sheets;return grid()}catch(e){}}login()})();
</script>
</body>
</html>
